name: Update Homebrew formula

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to apply (for example, v4.1.2)
        required: false
        type: string
  repository_dispatch:
    types: [donsetch-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: ./scripts/update-formula.sh "$TAG"

      - name: Check formula syntax
        run: ruby -c Formula/donsetch.rb

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Formula already current"
            exit 0
          fi
          version="$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Formula/donsetch.rb)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/donsetch.rb
          git commit -m "donsetch ${version}"
          git push origin HEAD:master
